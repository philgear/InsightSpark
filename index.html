<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" href="fonts/SparkDSRP-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/logo-dark.svg" as="image" type="image/svg+xml">
  <title>Pivot &amp; Pulse</title>
  <link rel="canonical" href="https://spark.philgear.dev">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description"
    content="An interactive lateral thinking workbench, positive psychology companion, and intergenerational care planner powered by Gemini AI and sovereign typography.">
  <meta name="theme-color" content="#24211c">

  <!-- OpenGraph & Twitter Meta Tags -->
  <meta property="og:title" content="Pivot &amp; Pulse — Systems Thinking &amp; Lateral Care Planner">
  <meta property="og:description" content="A fluid thinking partner combining lateral provocations, Martin Seligman's PERMA+H framework, and sovereign typography.">
  <meta property="og:url" content="https://spark.philgear.dev">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Schema.org Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Pivot & Pulse",
    "url": "https://spark.philgear.dev",
    "description": "An interactive lateral thinking workbench, positive psychology companion, and intergenerational care planner.",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": "Phil Gear",
      "identifier": "https://orcid.org/0009-0008-1372-5381"
    }
  }
  </script>

  <!-- iOS specific tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pivot &amp; Pulse">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style media="print">
    @page {
      margin: 0.75in;
    }

    body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body * {
      visibility: hidden;
      background: transparent !important;
      color: #000 !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    .printable-section,
    .printable-section * {
      visibility: visible;
    }

    .printable-section {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      padding: 0;
      margin: 0;
      font-family: 'Spark DSRP', Georgia, serif;
    }

    .printable-section h2 {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 1.5rem;
      font-family: 'Spark DSRP', Georgia, serif;
    }

    .printable-section h3,
    .printable-section h4 {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1.25rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid #999;
      font-family: 'Spark DSRP', Georgia, serif;
    }

    .printable-section ul {
      list-style-position: inside;
      padding-left: 0;
      margin-top: 0.5rem;
    }

    .printable-section li {
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .printable-section app-icon,
    .non-printable {
      display: none !important;
    }
  </style>

</head>

<body
  class="selection:bg-[var(--text-accent)] selection:text-[var(--primary-cta-text)] antialiased h-screen overflow-hidden">
  <app-root></app-root>
</body>

</html>
